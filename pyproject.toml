[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "password-auditor"
version = "1.0.0"
description = "Audit password strength offline and check breaches via HIBP k-anonymity"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.31,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
password-auditor = "password_auditor.cli:main"

[tool.setuptools]
packages = ["password_auditor", "password_auditor.data"]

[tool.setuptools.package-data]
"password_auditor.data" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
